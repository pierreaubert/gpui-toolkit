# Coverage configuration for the gpui-toolkit workspace.
#
# This file is the human-readable source of truth. The Justfile recipes mirror
# these values; keep them in sync when editing.

[llvm-cov]
# Features used when running coverage. Must match the workspace `features`
# variable in the Justfile.
features = [
    "autoeq",
    "camera",
    "gpu-2d",
    "gpu-3d",
    "reqwest",
    "showcase",
    "spinorama",
    "tokio",
    "urlencoding",
]

[llvm-cov.output]
# Output formats generated by `just qa-cov`.
formats = ["html", "json", "lcov"]
output_dir = "target/qa/cov"

[llvm-cov.check]
# CI-optimized `just qa-cov-check` only needs JSON for the threshold parser.
formats = ["json"]

[llvm-cov.ignore]
# Regex matching paths to exclude from coverage reports.
filename_regex = '.*/(tests|benches|examples|target|crates/3rdparties|crates/gpui-au|crates/gpui-android|crates/gpui-ios|crates/gpui-miniapp|crates/.*/bin)/.*'

[thresholds]
# Enforced aggregate ratchet used by scripts/qa_cov_check.py.
aggregate_lines = 73.5
# Release target. Raise the ratchet as measured coverage improves.
target_lines = 90.0
# Per-crate floors are enforced from this file so a crate cannot silently
# collapse to zero beneath the aggregate.
per_crate_file = "qa/cov/crate-thresholds.json"
