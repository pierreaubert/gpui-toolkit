[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gpui-toolkit"
version = "0.9.25"
description = "Python declarations for GPUI Toolkit apps and retained 3D scene specs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
authors = [
    { name = "Pierre F. Aubert", email = "pierre@spinorama.org" },
]
keywords = ["gpui", "ui", "visualization", "scene3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]

# Arrow remains optional: declarations and the generic host install without
# Python binary dependencies, while this extra enables live Dataset IPC frames.
arrow = ["pyarrow>=14"]

[project.urls]
Repository = "https://github.com/pierreaubert/gpui-toolkit"
Documentation = "https://docs.rs/gpui-toolkit"

[tool.maturin]
bindings = "pyo3"
features = ["python-extension"]
manifest-path = "Cargo.toml"
module-name = "gpui_toolkit._native"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*~"]
