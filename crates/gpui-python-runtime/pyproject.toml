[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gpui-toolkit"
version = "0.11.1"
description = "Native GPU desktop apps, charts and 3D scenes in pure Python — GPUI rendering, no Rust toolchain required"
readme = "PYPI.md"
requires-python = ">=3.10"
license = { text = "ISC" }
authors = [
    { name = "Pierre F. Aubert", email = "pierre@spinorama.org" },
]
keywords = ["gpui", "gui", "desktop", "gpu", "ui", "charts", "visualization", "scene3d", "native"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]

# Arrow remains optional: declarations and the generic host install without
# Python binary dependencies, while this extra enables live Dataset IPC frames.
arrow = ["pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/pierreaubert/gpui-toolkit"
Documentation = "https://github.com/pierreaubert/gpui-toolkit/blob/main/crates/gpui-python-runtime/python/tutorial/README.md"
Repository = "https://github.com/pierreaubert/gpui-toolkit"
Issues = "https://github.com/pierreaubert/gpui-toolkit/issues"
Changelog = "https://github.com/pierreaubert/gpui-toolkit/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
features = ["python-extension"]
manifest-path = "Cargo.toml"
module-name = "gpui_toolkit._native"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*~"]
