[package]
name = "gpui-web-foreign"
version = "0.10.44"
edition.workspace = true
rust-version = "1.89"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Foreign-parent editor embedding for the browser: GPUI editors in page-owned canvases"
license.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
gpui-foreign-parent = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3.104", features = [
    "CssStyleDeclaration",
    "CompositionEvent",
    "Document",
    "DomRectReadOnly",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "WheelEvent",
    "Window",
    "console",
] }

[[example]]
name = "browser_lifecycle"
crate-type = ["cdylib"]
