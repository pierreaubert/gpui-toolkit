[package]
name = "gpui-pretext"
version = "0.9.11"
authors.workspace = true
edition.workspace = true
rust-version = "1.89"
keywords.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance text measurement and multiline layout without DOM reflows — Rust port of chenglou/pretext"

[features]
default = []
autoeq = []
gpu-2d = []
gpu-3d = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
unicode-segmentation = { workspace = true }
unicode-bidi = "0.3"
hashbrown = "0.17"

[dev-dependencies]
criterion = { workspace = true }
gpui-profiler = { path = "../gpui-profiler", features = ["global-allocator"] }
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "layout_temporaries"
harness = false
