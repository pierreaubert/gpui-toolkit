[package]
name = "gpui-audio-kit"
version = "0.9.8"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Audio-focused GPUI components for plugin and playback interfaces"
license.workspace = true
repository.workspace = true

[features]
default = ["vello"]
vello = ["gpui-d3rs/vello-gpui"]
autoeq = []
gpu-2d = []
gpu-3d = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
gpui = { workspace = true }
gpui-d3rs = { workspace = true, default-features = false, features = ["gpui"] }
gpui-design = { workspace = true, features = ["gpui"] }
gpui-ui-kit = { workspace = true }

[dev-dependencies]
gpui = { package = "gpui-toolkit-gpui", path = "../3rdparties/gpui", features = ["test-support"] }
gpui-miniapp = { path = "../gpui-miniapp" }
gpui-profiler = { path = "../gpui-profiler", features = ["global-allocator"] }

[lib]
name = "gpui_audio_kit"
path = "src/lib.rs"
