[package]
name = "gpui-keybinding"
version = "0.9.6"
authors.workspace = true
edition.workspace = true
description = "Reusable keybinding framework with Vim/Emacs/VSCode presets for GPUI applications"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "keybinding", "ui"]
categories = ["gui"]

[features]
# Workspace-wide QA enables a common feature union for every public crate.
# These no-op aliases keep that command valid when this crate has no optional
# implementation for a given capability.
default = []
autoeq = []
gpu-2d = []
gpu-3d = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
gpui = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gpui-profiler = { path = "../gpui-profiler", features = ["global-allocator"] }

[[bench]]
name = "discovery"
harness = false

[lib]
name = "gpui_keybinding"
path = "src/lib.rs"
