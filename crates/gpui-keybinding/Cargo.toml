[package]
name = "gpui-keybinding"
version = "0.9.6"
authors.workspace = true
edition.workspace = true
description = "Reusable keybinding framework with Vim/Emacs/VSCode presets for GPUI applications"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "keybinding", "ui"]
categories = ["gui"]

[features]
default = []
autoeq = []
gpu-2d = []
gpu-3d = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
gpui = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gpui-profiler = { workspace = true, features = ["global-allocator"] }

[[bench]]
name = "discovery"
harness = false

[lib]
name = "gpui_keybinding"
path = "src/lib.rs"
