[package]
name = "gpui-macos-platform-view"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embed AppKit NSViews next to GPUI content on macOS: ViewHandle, frame reporting, VerticalStack"
license.workspace = true
readme = "README.md"
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
gpui = { workspace = true }
raw-window-handle = "0.6"
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { workspace = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["objc2-quartz-core"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGColor"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-graphics"] }
