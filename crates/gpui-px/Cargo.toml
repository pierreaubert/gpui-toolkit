[package]
name = "gpui-px"
version = "0.9.9"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level Plotly Express-style charting API built on d3rs and GPUI"

[features]
default = ["gpui", "gpu-2d"]
autoeq = ["dep:autoeq"]
gpui = ["dep:gpui", "dep:gpui-ui-kit", "dep:gpui-miniapp", "dep:gpui-builder", "dep:gpui-design", "gpui-design/gpui", "gpui-d3rs/gpui"]
gpu-3d = ["gpui-d3rs/gpu-3d", "gpui-d3rs/gpu-compute", "dep:glam", "dep:image"]
gpu-2d = ["gpui-d3rs/gpu-2d"]
vello = ["gpui-d3rs/vello-gpui"]
gpu-metal = ["gpu-2d", "gpu-3d", "gpui-d3rs/gpu-metal", "gpui"]
headless-qa = [
    "gpu-3d",
    "gpui-d3rs/headless-qa",
    "gpui/test-support",
    "dep:gpui_wgpu",
]
native-qa = [
    "gpu-metal",
    "gpui/test-support",
    "dep:gpui_macos",
    "gpui_macos/test-support",
]
reqwest = ["dep:reqwest"]
showcase = []
spinorama = ["autoeq", "tokio", "reqwest", "urlencoding", "gpu-3d"]
tokio = ["dep:tokio"]
urlencoding = ["dep:urlencoding"]

[dependencies]
gpui = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
gpui-miniapp = { workspace = true, optional = true }
gpui-builder = { workspace = true, optional = true }
gpui-design = { workspace = true, optional = true }
gpui-d3rs = { workspace = true }
gpui_wgpu = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
image = { workspace = true, optional = true }
thiserror = { workspace = true }
autoeq = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-profiler = { workspace = true, features = ["global-allocator"] }
criterion = { workspace = true }

[[bench]]
name = "streaming_prepare"
harness = false

[[bench]]
name = "mesh_plot_frames"
harness = false

[[test]]
name = "mesh_plot_wgpu_product"
path = "tests/mesh_plot_wgpu_product.rs"
required-features = ["native-qa", "headless-qa"]

[[example]]
name = "mesh_plot_showcase"
path = "examples/mesh_plot_showcase.rs"
required-features = ["gpui", "gpu-3d"]

[[bin]]
name = "px-showcase"
path = "bin/showcase.rs"
required-features = ["gpui", "gpu-2d"]

[[bin]]
name = "px-spinorama"
path = "bin/spinorama_demo.rs"
required-features = ["gpui", "autoeq", "tokio", "reqwest", "urlencoding"]

[[example]]
name = "logscale_demo"
path = "examples/logscale_demo.rs"
required-features = ["gpui"]
