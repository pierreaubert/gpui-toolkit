[package]
name = "gpui-linux-foreign"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Foreign-parent editor embedding for Linux: GPUI editors in host-owned X11 windows and Wayland surfaces (VST3/CLAP)"
license.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
gpui-foreign-parent = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true, features = ["wayland", "x11"] }
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
