[package]
name = "gpui-ui-kit"
version = "0.9.40"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A reusable UI component library for GPUI applications"
license.workspace = true
repository.workspace = true
autoexamples = false

[dependencies]
# GPUI framework
gpui = { workspace = true }
gpui-builder = { workspace = true }
gpui-design = { workspace = true, features = ["gpui"] }
gpui-d3rs = { workspace = true, default-features = false, features = ["gpui"] }

# Serialization for Color type
serde = { workspace = true }
serde_json = { workspace = true }
libm = "0.2"

# UUID for node/connection IDs
uuid = { workspace = true }

# QR code generation
qrcode = { workspace = true }
image = { workspace = true }

# Proc macros for theme generation
gpui-ui-kit-macros = { workspace = true }

# Wasm-safe monotonic clock (aliases std::time on native targets; the std
# `Instant` panics on wasm32-unknown-unknown).
web-time = "1.1.0"

# Platform backends (gpui_macos, gpui_linux, gpui_windows, gpui-ios) are NOT
# declared here. They live only in zed-industries/zed's git tree (or, for
# gpui-ios, the local workspace) with no crates.io release, so depending on
# them would make this crate unpublishable. Application shells live in the
# sibling `gpui-miniapp` crate (publish = false).

# Async timer for animated components. smol (via async-io/polling) has no
# wasm32-unknown-unknown support, so it stays native-only; the wasm build uses
# gpui's BackgroundExecutor::timer at the call sites instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = { workspace = true }

[features]
default = ["vello"]
vello = ["gpui-d3rs/vello-gpui"]
bench = []
autoeq = []
reqwest = []
spinorama = []
tokio = []
urlencoding = []

[dev-dependencies]
gpui = { package = "gpui-toolkit-gpui", path = "../3rdparties/gpui", features = ["test-support"] }
rqrr = { workspace = true }
criterion = { workspace = true }
gpui-profiler = { path = "../gpui-profiler", features = ["global-allocator"] }
# Examples in `examples/` use the MiniApp shell, which lives in a workspace-
# only crate (it transitively pulls in non-publishable platform backends).
gpui-miniapp = { path = "../gpui-miniapp" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = { workspace = true }
objc = { workspace = true }

[lib]
name = "gpui_ui_kit"
path = "src/lib.rs"

