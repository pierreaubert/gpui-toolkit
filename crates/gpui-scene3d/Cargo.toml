[package]
name = "gpui-scene3d"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description = "3D scene rendering for GPUI: camera, transfer functions, chunked GPU preparation, animation"
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_scene3d"

[features]
default = []
# PNG frame export for movies and headless QA. Pure-Rust encoder, wasm-safe.
png = ["dep:image"]
# GPUI element that paints rendered frames as GPUI images. Native hosts use
# it directly; browser hosts keep the default software path and drive the
# same scene through their own canvas element.
gpui = ["dep:gpui", "dep:image"]
# MP4 muxing of rendered frames through the system `ffmpeg` (H.264/yuv420p).
# Native only: wasm hosts download the PNG sequence instead. The encoder is
# located at runtime, so builds never depend on it.
mp4 = ["png"]
# GPU-resident surface rendering through wgpu (Metal on Apple Silicon,
# Vulkan/CUDA-class adapters elsewhere, WebGPU in the browser).
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
gpui-dataset-transformation = { workspace = true }
gpui-miniapp = { workspace = true }

# Metal headless harness for the macOS-only viewer interaction tests.
# Kept off every other target so the wasm demo graph stays browser-safe.
[target.'cfg(all(not(target_family = "wasm"), target_os = "macos"))'.dev-dependencies]
gpui_macos = { workspace = true, features = ["test-support"] }

[dependencies]
gpui = { workspace = true, optional = true }
gpui-mesh = { workspace = true }
image = { workspace = true, optional = true }
thiserror = { workspace = true }
smallvec = { workspace = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }

# The mesh-showcase example doubles as the browser demo (Trunk builds it via
# `[build] example = "mesh-showcase"`); examples resolve dev-dependencies, so
# the wasm entry point's bindgen import lives here. Plain gpui (no
# test-support: proptest cannot build for wasm32-unknown-unknown).
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2"
gpui = { workspace = true }

[[bench]]
name = "render_bench"
harness = false

[[example]]
name = "pcfan_airflow"
path = "examples/pcfan_airflow.rs"
required-features = ["png", "mp4"]

[[example]]
name = "speaker_port"
path = "examples/speaker_port.rs"
required-features = ["png", "mp4"]

[[example]]
name = "necking_bar"
path = "examples/necking_bar.rs"
required-features = ["png", "mp4"]

[[example]]
name = "gpu_render"
path = "examples/gpu_render.rs"
required-features = ["gpu", "png"]

[[example]]
name = "flow_showcase"
path = "examples/flow_showcase.rs"
required-features = ["png", "mp4"]

[[example]]
name = "interactive_viewer"
path = "examples/interactive_viewer.rs"
required-features = ["gpui"]

# The demo app is an example target (not a bin) so it can use the
# dev-dependency shell crates (gpui-miniapp) — keeping them out of
# [dependencies] avoids a package cycle. Run with
# `cargo run -p gpui-scene3d --example mesh-showcase --features gpui`.
[[example]]
name = "mesh-showcase"
path = "examples/mesh_showcase_main.rs"
required-features = ["gpui"]
