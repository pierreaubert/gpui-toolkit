[package]
name = "gpui-component-lab"
version = "0.9.4"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Prop-driven component lab and responsive preview matrix for gpui-toolkit"
license.workspace = true
repository.workspace = true

[features]
default = []
autoeq = []
gpu-2d = []
gpu-3d = []
profiler = ["gpui-profiler/global-allocator"]
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []
visual-capture = [
    "gpui/test-support",
    "dep:gpui_macos",
    "gpui_macos/test-support",
    "gpui-px/gpu-metal",
]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
gpui = { workspace = true }
gpui-audio-kit = { workspace = true }
gpui-design-tools = { workspace = true }
gpui-design = { workspace = true }
gpui-miniapp = { workspace = true }
gpui-profiler = { workspace = true }
gpui-px = { workspace = true, features = ["gpui", "gpu-3d", "gpu-metal"] }
gpui-d3rs = { workspace = true }
gpui-showcase = { workspace = true }
gpui-ui-kit = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "gpui_component_lab"
path = "src/lib.rs"

[[bin]]
name = "gpui-component-lab"
path = "src/bin/gpui_component_lab.rs"
