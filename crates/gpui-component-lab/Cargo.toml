[package]
name = "gpui-component-lab"
version = "0.8.2"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Prop-driven component lab and responsive preview matrix for gpui-toolkit"
license.workspace = true
repository.workspace = true

[features]
default = []
autoeq = []
camera = []
gpu-2d = []
gpu-3d = []
profiler = ["gpui-profiler/global-allocator"]
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
gpui = { workspace = true }
gpui-audio-kit = { workspace = true }
gpui-design-tools = { workspace = true }
gpui-miniapp = { workspace = true }
gpui-profiler = { workspace = true }
gpui-px = { workspace = true, features = ["gpui", "gpu-3d"] }
gpui-ui-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "gpui_component_lab"
path = "src/lib.rs"

[[bin]]
name = "gpui-component-lab"
path = "src/bin/gpui_component_lab.rs"
