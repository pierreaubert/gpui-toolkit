[package]
name = "gpui-toolkit"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Convenience aggregate crate that re-exports all GPUI toolkit libraries"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = ["ui"]
ui = [
    "dep:gpui-builder",
    "dep:gpui-design",
    "dep:gpui-keybinding",
    "dep:gpui-pretext",
    "dep:gpui-ui-kit",
    "dep:gpui-ui-kit-macros",
]
audio = ["ui", "dep:gpui-audio-kit"]
charts = ["ui", "dep:gpui-d3rs", "dep:gpui-px"]
themes = ["ui", "dep:gpui-themes"]
core = [
    "audio",
    "charts",
    "themes",
]
tooling = [
    "dep:gpui-component-lab",
    "dep:gpui-design-tools",
    "dep:gpui-miniapp",
    "dep:gpui-profiler",
    "dep:gpui-python-runtime",
    "dep:gpui-scaffolder",
]
platform = ["dep:gpui-au", "ios"]
all = ["core", "tooling", "platform"]
ios = ["dep:gpui-ios"]

[dependencies]
gpui-au = { workspace = true, optional = true }
gpui-audio-kit = { workspace = true, optional = true }
gpui-builder = { workspace = true, optional = true }
gpui-component-lab = { workspace = true, optional = true }
gpui-d3rs = { workspace = true, default-features = true, optional = true }
gpui-design = { workspace = true, optional = true }
gpui-design-tools = { workspace = true, optional = true }
gpui-ios = { workspace = true, optional = true }
gpui-keybinding = { workspace = true, optional = true }
gpui-miniapp = { workspace = true, optional = true }
gpui-pretext = { workspace = true, optional = true }
gpui-profiler = { workspace = true, optional = true }
gpui-px = { workspace = true, default-features = true, optional = true }
gpui-python-runtime = { workspace = true, optional = true }
gpui-scaffolder = { workspace = true, optional = true }
gpui-themes = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
gpui-ui-kit-macros = { workspace = true, optional = true }
