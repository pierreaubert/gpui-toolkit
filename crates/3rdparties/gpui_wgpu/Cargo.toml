[package]
name = "gpui-toolkit-gpui-wgpu"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "gpui_wgpu"
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]
# Enables the offscreen renderer used by adapter-backed GPUI visual QA.
headless-qa = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { workspace = true, default-features = false }
anyhow = "1.0"
bytemuck = "1"
collections = { workspace = true }
cosmic-text = "0.17.0"
etagere = "0.2"
itertools = "0.15.0"
log = "0.4"
parking_lot = "0.12"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
gpui_util = { workspace = true }
wgpu = { version = "29.0.0", git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
image = { workspace = true, optional = true }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"
