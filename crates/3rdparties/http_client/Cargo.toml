[package]
name = "gpui-toolkit-http-client"
version = "0.1.0"
edition = "2024"
description = "A HTTP client library for Zed and GPUI"
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "http_client"
path = "src/http_client.rs"
doctest = true

[features]
test-support = []
github-download = ["dep:async-fs", "dep:async-tar", "dep:sha2", "dep:tempfile", "dep:util"]

[dependencies]
anyhow = "1.0.86"
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
bytes = "1.0"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
futures = "0.3.32"
http-body = "1.0"
http = "1.1"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_urlencoded = "0.7"
url = "2.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
util = { workspace = true, optional = true }
async-fs = { version = "2.1", optional = true }
async-tar = { version = "0.6.1", optional = true }
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3.20.0", optional = true }
