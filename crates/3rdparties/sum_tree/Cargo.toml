[package]
name = "gpui-toolkit-sum-tree"
version = "0.1.0"
edition = "2024"
description = "A sum tree data structure, a concurrency-friendly B-tree"
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sum_tree"
path = "src/sum_tree.rs"
doctest = false

[features]
test-support = ["proptest"]

[dependencies]
heapless = "0.9.2"
rayon = "1.8"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
tracing = "0.1.40"
proptest = { workspace = true, features = ["attr-macro"], optional = true }

[dev-dependencies]
ctor = "1.0.6"
rand = "0.9"
proptest = { workspace = true, features = ["attr-macro"] }
