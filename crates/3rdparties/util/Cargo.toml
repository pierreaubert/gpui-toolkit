[package]
name = "gpui-toolkit-util"
version = "0.1.1"
edition = "2024"
description = "A collection of utility structs and functions used by Zed and GPUI"
license = "Apache-2.0"

[lib]
name = "util"
path = "src/util.rs"
doctest = true

[features]
test-support = ["rand", "util_macros"]

[dependencies]
anyhow = "1.0.86"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
collections = { workspace = true }
dunce = "1.0"
futures-lite = "1.13"
futures = "0.3.32"
globset = "0.4"
itertools = "0.15.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
rand = { version = "0.9", optional = true }
regex = "1.5"
rust-embed = { version = "8.11", features = ["include-exclude"] }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
shlex = "1.3.0"
take-until = "0.2.0"
tempfile = "3.20.0"
unicase = "2.6"
url = "2.2"
percent-encoding = "2.3.2"
util_macros = { workspace = true, optional = true }
gpui_util = { workspace = true }

[dev-dependencies]
rand = "0.9"
util_macros = { package = "gpui-toolkit-util-macros", path = "../util_macros" }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = "2.0"
which = "6.0.0"
async-fs = "2.1"
walkdir = "2.5"
dirs = "6.0"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc = "0.2"
nix = { version = "0.29", features = ["user"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.5"

[target.'cfg(windows)'.dependencies]
tendril = "0.4.3"
windows = { version = "0.61", features = ["Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }
