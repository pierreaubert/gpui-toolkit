[package]
name = "ztracing"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
tracy = ["tracing-tracy", "tracy-client"]

[dependencies]
zlog = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
tracing = "0.1.40"
tracing-subscriber = "0.3.22"
tracing-tracy = { version = "0.11.4", features = ["enable", "ondemand"], optional = true }
tracy-client = { version = "0.18.2", features = ["enable", "ondemand"], optional = true }
ztracing_macro = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
