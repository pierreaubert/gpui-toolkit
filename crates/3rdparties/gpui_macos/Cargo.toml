[package]
name = "gpui-toolkit-gpui-macos"
version = "0.1.2"
edition = "2024"
description.workspace = true
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "gpui_macos"
path = "src/gpui_macos.rs"

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit"]
screen-capture = ["gpui/screen-capture"]

[dependencies]
gpui = { workspace = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = "0.24.0"
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
async-task = "4.7"
block = "0.1"
cocoa = "=0.26.0"
collections = { workspace = true }
core-foundation = "=0.10.1"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5.2", features = ["metal"] }
ctor = "1.0.6"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
dispatch2 = "0.3.1"
etagere = "0.2"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", optional = true }
foreign-types = "0.5"
futures = "0.3.32"
gpui_util = { workspace = true }
image = { version = "0.25.1", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
itertools = "0.15.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
media = { workspace = true }
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSString", "NSURL", "NSUndoManager", "NSValue", "objc2-core-foundation", "std"] }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
semver = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.27.2", features = ["derive"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }
gpui = { workspace = true, default-features = false }
