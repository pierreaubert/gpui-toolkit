# SotF vendor of zed-industries/zed#v1.0.0 :: crates/gpui_macos
#
# Why this is vendored:
#   The upstream gpui_macos crate references the private CGS symbols
#   `CGSMainConnectionID` and `CGSSetWindowBackgroundBlurRadius` for
#   pre-Monterey window-background blur. SotF requires macOS 13.0+
#   (Info.plist LSMinimumSystemVersion), so the legacy code path is
#   unreachable, but Apple's Mac App Store static analyzer rejects
#   ANY mention of these symbols in the binary's import table.
#   This vendor strips the FFI declaration and the unreachable call.
#
# This package sits OUTSIDE the SotF workspace (see `exclude` in the
# root Cargo.toml), so every dependency must be explicit — `.workspace
# = true` from the upstream Cargo.toml has been expanded to literal
# versions taken from zed-industries/zed @ tag v1.0.0's workspace.
[package]
name = "gpui_macos"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_macos.rs"

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit"]
screen-capture = ["gpui/screen-capture"]
# Compatibility shim for objc 0.2's class! macro, which still expands
# cfg(feature = "cargo-clippy") in the destination crate.
cargo-clippy = []

[dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0.86"
async-task = "4.7"
block = "0.1"
cocoa = "=0.26.0"
collections = { git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
core-foundation = "=0.10.0"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5.2", features = ["metal"] }
ctor = "0.4.0"
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
dispatch2 = "0.3.1"
etagere = "0.2"
# WARNING: keep this rev in lockstep with the [patch] entry for
# zed-font-kit in the SotF root Cargo.toml.
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
futures = "0.3.32"
image = "0.25.1"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
media = { git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
metal = "0.33"
objc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics"] }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
semver = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.27.2", features = ["derive"] }
util = { git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
