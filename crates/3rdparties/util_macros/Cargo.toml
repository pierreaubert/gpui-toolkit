[package]
name = "gpui-toolkit-util-macros"
version = "0.1.0"
edition = "2024"
description = "Utility macros for Zed"
license = "Apache-2.0"

[lib]
name = "util_macros"
path = "src/util_macros.rs"
proc-macro = true
doctest = false

[features]
perf-enabled = []

[dependencies]
quote = "1.0.9"
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
perf = { workspace = true }
