[package]
name = "gpui-toolkit-gpui-web"
version = "0.1.1"
edition = "2024"
description.workspace = true
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "gpui_web"
path = "src/gpui_web.rs"

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread"]

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { workspace = true }
parking_lot = { version = "0.12.1", features = ["nightly"] }
gpui_wgpu = { workspace = true }
http_client = { workspace = true }
anyhow = "1.0.86"
futures = "0.3.32"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle = "0.6"
wasm_thread = { version = "0.3", features = ["es_modules"], optional = true }
web-sys = { version = "0.3", features = ["console", "CompositionEvent", "CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "DragEvent", "Element", "EventTarget", "File", "FileList", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "MediaQueryList", "MediaQueryListEvent", "MessageChannel", "MessageEvent", "MessagePort", "MouseEvent", "Navigator", "PointerEvent", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverSize", "ResizeObserverOptions", "Screen", "Storage", "VisualViewport", "Headers", "Request", "RequestInit", "RequestRedirect", "Response", "WheelEvent", "Window"] }
