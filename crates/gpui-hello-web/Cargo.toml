[package]
name = "gpui-hello-web"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "gpui-hello-web"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-miniapp = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3.104", features = ["Window", "Document", "Element", "HtmlElement", "console"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
