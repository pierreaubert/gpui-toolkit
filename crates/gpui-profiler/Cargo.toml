[package]
name = "gpui-profiler"
version = "0.9.2"
edition.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lightweight allocation profiling utilities for GPUI applications"
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
# Install a counting global allocator. Disable for zero-overhead builds.
global-allocator = ["dep:stats_alloc"]

[dependencies]
stats_alloc = { workspace = true, optional = true }
