[package]
name = "gpui-miniapp"
version = "0.9.8"
edition.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Minimal application shell for GPUI examples and showcases — bundles platform-backend selection so individual demos don't have to."
license.workspace = true
repository.workspace = true
readme = "README.md"
# Not publishable: depends on Zed's per-platform GPUI backends (gpui_macos,
# gpui_linux, gpui_windows) which only exist in the zed-industries/zed git
# tree. They have no crates.io release, so any crate that pulls them in is
# unpublishable. Keep this crate workspace-internal so gpui-ui-kit itself can
# stay publishable.
publish = false

[lib]
name = "gpui_miniapp"
path = "src/lib.rs"

[features]
default = ["builder"]
autoeq = []
builder = ["dep:gpui-builder"]
gpu-2d = []
gpu-3d = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
gpui = { workspace = true }
gpui-builder = { workspace = true, optional = true }
gpui-design = { workspace = true, features = ["gpui"] }
# default-features = false keeps ui-kit's `vello` default (ThinkingOrb; pulls
# vello+wgpu+vello_cpu) out of `--no-default-features` gpui-d3rs demo builds,
# which use this shell via dev-dependencies. Consumers that render ThinkingOrb
# enable ui-kit's `vello` through their own direct ui-kit dependency.
# A direct path dep is used because Cargo rejects `default-features = false`
# on a `workspace = true` dep inside the d3rs ↔ ui-kit dev-dependency cycle.
gpui-ui-kit = { path = "../gpui-ui-kit", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true }
# gpui pulls in rusqlite/libsqlite3-sys, but a system sqlite3 is not available
# when cross-compiling for Windows from Linux. Build sqlite3 from source instead.
libsqlite3-sys = { version = "0.36", features = ["bundled"] }

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
gpui-ios = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
gpui-android = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { workspace = true }
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = ["Window", "Location", "Document", "HtmlElement"] }
