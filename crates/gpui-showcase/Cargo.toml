[package]
name = "gpui-showcase"
version = "0.9.5"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Showcase application for gpui-ui-kit components"
publish = false

[features]
profiler = ["gpui-profiler/global-allocator"]
profiler-tests = ["profiler", "gpui/test-support"]

[dependencies]
gpui = { workspace = true }
gpui-ui-kit = { workspace = true }
gpui-audio-kit = { workspace = true }
gpui-builder = { workspace = true }
gpui-d3rs = { workspace = true }
gpui-miniapp = { workspace = true }
gpui-design = { workspace = true, features = ["gpui"] }
gpui-profiler = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
gpui-ios = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"

[lib]
name = "gpui_showcase"
path = "src/lib.rs"

[[bin]]
name = "gpui-showcase"
path = "src/main.rs"
