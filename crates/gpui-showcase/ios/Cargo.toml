[package]
name = "gpui-showcase-ios"
version = "0.8.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "iOS/tvOS static library and Swift host for the GPUI showcase"
publish = false

[lib]
name = "showcase_ios"
crate-type = ["staticlib", "cdylib"]

[features]
default = []
autoeq = []
camera = []
gpu-2d = []
gpu-3d = []
hot-reload = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
gpui = { workspace = true }
gpui-ios = { workspace = true }
gpui-showcase = { workspace = true }
gpui-ui-kit = { workspace = true }
log = { workspace = true }

# Apple-only logging (oslog wraps os/log.h, only available on Apple platforms)
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "macos"))'.dependencies]
oslog = { workspace = true }
