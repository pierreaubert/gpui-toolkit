[package]
name = "gpui-showcase-ios"
version = "0.11.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "iOS/tvOS static library and Swift host for the GPUI showcase"
publish = false

[lints]
workspace = true

[lib]
name = "showcase_ios"
crate-type = ["staticlib", "cdylib"]

[features]
default = []
autoeq = []
camera = []
gpu-2d = []
gpu-3d = []
hot-reload = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
gpui = { workspace = true }
gpui-ios = { workspace = true }
gpui-showcase = { workspace = true }
gpui-ui-kit = { workspace = true }
log = { workspace = true }
oslog = { workspace = true }
