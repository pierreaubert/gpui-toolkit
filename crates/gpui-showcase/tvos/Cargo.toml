[package]
name = "gpui-showcase-tvos"
version = "0.8.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tvOS static library and Swift host for the GPUI showcase"
publish = false

[lib]
name = "showcase_tvos"
crate-type = ["staticlib"]

[features]
default = []
autoeq = []
camera = []
gpu-2d = []
gpu-3d = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
gpui = { workspace = true }
gpui-ios = { workspace = true }
gpui-showcase = { workspace = true }
gpui-ui-kit = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "tvos")'.dependencies]
oslog = { workspace = true }
