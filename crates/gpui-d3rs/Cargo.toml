[package]
name = "gpui-d3rs"
version = "0.9.10"
edition.workspace = true
repository.workspace = true
authors.workspace = true
description = "D3.js-inspired plotting library for GPUI"
license = "ISC"
keywords = ["gpui", "plotting", "visualization", "d3", "charts"]
categories = ["visualization", "gui"]
exclude = ["bin/"]

[lib]
name = "d3rs"

[features]
default = ["gpui", "gpu-2d", "gpu-3d"]
autoeq = ["dep:autoeq"]
camera = []
gpui = ["dep:gpui", "dep:gpui-ui-kit", "dep:gpui-miniapp", "dep:gpui-builder", "dep:gpui-design", "gpui-design/gpui", "dep:smol", "dep:fontdue", "dep:image"]
profiler = ["dep:gpui-profiler", "gpui-profiler/global-allocator"]
reqwest = ["dep:reqwest"]
showcase = []
spinorama = ["dep:autoeq", "dep:tokio", "dep:ndarray", "dep:reqwest", "dep:urlencoding", "gpui"]
tokio = ["dep:tokio"]
gpu-3d = ["dep:wgpu", "dep:bytemuck", "dep:glam", "dep:pollster", "gpui"]
gpu-2d = ["dep:wgpu", "dep:bytemuck", "dep:glam", "dep:pollster", "gpui"]
urlencoding = ["dep:urlencoding"]

[dependencies]
gpui = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
gpui-miniapp = { workspace = true, optional = true }
gpui-profiler = { workspace = true, optional = true }
gpui-builder = { workspace = true, optional = true }
gpui-design = { workspace = true, optional = true }
regex = { workspace = true }
delaunator = { workspace = true }
math-delaunay = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
autoeq = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
# GPU-accelerated 3D surface rendering
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
image = { workspace = true, optional = true }
fontdue = { workspace = true, optional = true }

# Per-platform GPUI backends (gpui_macos, gpui_linux, gpui_windows) come in
# transitively via the optional `gpui-miniapp` dep. Don't declare them here —
# they aren't on crates.io and would block publication of any crate that does.

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "force_many_body"
harness = false

[[bench]]
name = "d3_large_datasets"
harness = false

[[bin]]
name = "d3rs-showcase"
path = "bin/showcase/main.rs"
required-features = ["gpui", "gpu-2d"]


[[bin]]
name = "d3rs-spinorama"
path = "bin/spinorama_demo/main.rs"
required-features = ["spinorama", "gpu-2d", "gpu-3d"]

# Non-GPUI examples (can run without gpui feature)
[[example]]
name = "scale_demo"
path = "examples/scale_demo.rs"

[[example]]
name = "array_demo"
path = "examples/array_demo.rs"

[[example]]
name = "color_demo"
path = "examples/color_demo.rs"

[[example]]
name = "contour_demo"
path = "examples/contour_demo.rs"

[[example]]
name = "fetch_demo"
path = "examples/fetch_demo.rs"

[[example]]
name = "interpolate_demo"
path = "examples/interpolate_demo.rs"

[[example]]
name = "shape_demo"
path = "examples/shape_demo.rs"

[[example]]
name = "timer_demo"
path = "examples/timer_demo.rs"

[[example]]
name = "geo_demo"
path = "examples/geo_demo.rs"

[[example]]
name = "transition_demo"
path = "examples/transition_demo.rs"

[[example]]
name = "surface3d_demo"
path = "examples/surface3d_demo.rs"
required-features = ["gpu-3d"]

[[example]]
name = "sphere_gallery_demo"
path = "examples/sphere_gallery_demo.rs"
required-features = ["gpu-3d"]

[[example]]
name = "gpu2d_demo"
path = "examples/gpu2d_demo.rs"
required-features = ["gpu-2d"]

[[example]]
name = "gpu2d_shapes_demo"
path = "examples/gpu2d_shapes_demo.rs"
required-features = ["gpu-2d"]

[[example]]
name = "gpu2d_contour_demo"
path = "examples/gpu2d_contour_demo.rs"
required-features = ["gpu-2d"]

[[example]]
name = "hierarchy_demo"
path = "examples/hierarchy_demo.rs"

[[example]]
name = "force_demo"
path = "examples/force_demo.rs"

[[example]]
name = "chord_demo"
path = "examples/chord_demo.rs"

[[example]]
name = "chromatic_demo"
path = "examples/chromatic_demo.rs"

[[bench]]
name = "path_strings"
harness = false
