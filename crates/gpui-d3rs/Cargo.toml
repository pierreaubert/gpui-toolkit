[package]
name = "gpui-d3rs"
version = "0.9.14"
edition.workspace = true
repository.workspace = true
authors.workspace = true
description = "D3.js-inspired plotting library for GPUI"
license = "ISC"
keywords = ["gpui", "plotting", "visualization", "d3", "charts"]
categories = ["visualization", "gui"]
exclude = ["bin/"]

[lib]
name = "d3rs"

[features]
default = ["gpui", "gpu-2d", "gpu-3d", "vello-gpui"]
autoeq = ["dep:autoeq"]
gpui = ["dep:gpui", "dep:gpui-ui-kit", "dep:gpui-miniapp", "dep:gpui-builder", "dep:gpui-design", "gpui-design/gpui", "dep:smol", "dep:fontdue", "dep:image"]
profiler = ["dep:gpui-profiler", "gpui-profiler/global-allocator"]
reqwest = ["dep:reqwest"]
showcase = []
spinorama = ["dep:autoeq", "dep:tokio", "dep:ndarray", "dep:reqwest", "dep:urlencoding", "gpui"]
tokio = ["dep:tokio"]
gpu-3d = ["dep:wgpu", "dep:bytemuck", "dep:glam", "dep:pollster", "dep:gpui_wgpu", "gpui"]
gpu-2d = ["dep:wgpu", "dep:bytemuck", "dep:glam", "dep:pollster", "dep:gpui_wgpu", "gpui"]
vello = ["dep:vello", "dep:vello_cpu", "dep:peniko", "dep:kurbo", "dep:bytemuck", "dep:log"]
vello-gpui = ["vello", "gpui", "gpu-2d"]
gpu-metal = ["gpu-2d", "gpu-3d", "gpui", "dep:metal", "dep:objc", "dep:gpui_macos"]
metal-qa = ["gpu-metal", "gpui/test-support", "gpui_macos/test-support"]
gpu-compute = ["gpu-2d"]
# Real GPUI scene readback for adapter-backed product visual QA.
headless-qa = ["gpu-3d", "gpui_wgpu/headless-qa"]
urlencoding = ["dep:urlencoding"]

[dependencies]
gpui = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
gpui-miniapp = { workspace = true, optional = true }
gpui-profiler = { workspace = true, optional = true }
gpui-builder = { workspace = true, optional = true }
gpui-design = { workspace = true, optional = true }
regex = { workspace = true }
delaunator = { workspace = true }
math-delaunay = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
autoeq = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
# GPU-accelerated 3D surface rendering
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
vello_cpu = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
log = { workspace = true, optional = true } # d3rs has no log dep on main; workspace pins log 0.4.28 (root Cargo.toml :80)
gpui_wgpu = { path = "../3rdparties/gpui_wgpu", optional = true }
image = { workspace = true, optional = true }
fontdue = { workspace = true, optional = true }

# Per-platform GPUI backends (gpui_macos, gpui_linux, gpui_windows) come in
# transitively via the optional `gpui-miniapp` dep. Don't declare them here —
# they aren't on crates.io and would block publication of any crate that does.

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
objc = { workspace = true, optional = true }
gpui_macos = { path = "../3rdparties/gpui_macos", optional = true }

# Async runtime for GPUI-era helpers. smol (via async-io/polling) has no
# wasm32-unknown-unknown support, so it stays native-only (same pattern as
# gpui-ui-kit); no d3rs source references it directly.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = { workspace = true, optional = true }

# Async device init for gpu2d on the browser target (spawn_local drives
# create_device().await; blocking the main thread with pollster throws
# Atomics.wait RuntimeErrors).
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "force_many_body"
harness = false

[[bench]]
name = "d3_large_datasets"
harness = false

[[bench]]
name = "mesh_prep"
harness = false

[[bin]]
name = "d3rs-showcase"
path = "bin/showcase/main.rs"
required-features = ["gpui", "gpu-2d"]


[[bin]]
name = "d3rs-spinorama"
path = "bin/spinorama_demo/main.rs"
required-features = ["spinorama", "gpu-2d", "gpu-3d"]

