# Dependency policy for the GPUI Toolkit release gate.
#
# This file is intentionally conservative about source origins and permissive
# about duplicate versions for now. The workspace carries several patched Zed
# dependencies, so release QA should run cargo-deny, review every warning, and
# tighten this policy as the dependency graph stabilizes.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Unmaintained warnings tracked in dependency_hygiene.rs; replacements need upstream moves.
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    # Unmaintained zbus support crates via vendored gpui_linux -> accesskit_unix/atspi
    # (Linux accessibility path in the sotf-3rdparties pin); no safe upgrade until the
    # vendored Linux backend moves to a maintained zbus stack. Tracked in
    # dependency_hygiene.rs.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Consolidated snapshot repository for the history-free vendored GPUI
    # platform crates (renamed sotf-* packages); replaces the former
    # sibling path dependencies and per-crate Zed git remotes.
    "https://github.com/pierreaubert/sotf-3rdparties",
]
