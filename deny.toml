# Dependency policy for the GPUI Toolkit release gate.
#
# This file is intentionally conservative about source origins and permissive
# about duplicate versions for now. The workspace carries several patched Zed
# dependencies, so release QA should run cargo-deny, review every warning, and
# tighten this policy as the dependency graph stabilizes.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # Accepted quick-xml parser vulnerabilities in upstream Zed Linux platform deps.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Unmaintained warnings tracked in dependency_hygiene.rs; replacements need upstream moves.
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
    # Unmaintained async-std via vendored http_client -> async-tar (entered the lock with
    # the Phase-1 vendored closure); no safe upgrade until upstream Zed moves off it.
    "RUSTSEC-2025-0052",
    # Unmaintained rustybuzz via usvg -> gpui (pre-existing upstream Zed SVG text path,
    # flagged by a freshly published advisory); no safe upgrade available.
    "RUSTSEC-2026-0206",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/proptest-rs/proptest",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wgpu.git",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/zed.git",
    # [patch.crates-io] mirrors of zed v1.9.0's own patches: the async-process fork is
    # required to compile vendored `util` (smol::process::Child::adopt_raw_pid); the
    # smol-rs async-task rev is pinned alongside it by the same upstream patch set.
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/smol-rs/async-task.git",
]
