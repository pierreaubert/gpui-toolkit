[workspace]
members = [
    "crates/gpui-au",
    "crates/gpui-android",
    "crates/gpui-audio-kit",
    "crates/gpui-builder",
    "crates/gpui-component-lab",
    "crates/gpui-d3rs",
    "crates/gpui-design",
    "crates/gpui-design-tools",
    "crates/gpui-hello-web",
    "crates/gpui-ios",
    "crates/gpui-keybinding",
    "crates/gpui-layout-expr",
    "crates/gpui-miniapp",
    "crates/gpui-pretext",
    "crates/gpui-profiler",
    "crates/gpui-px",
    "crates/gpui-python-runtime",
    "crates/gpui-release-gates",
    "crates/gpui-scaffolder",
    "crates/gpui-showcase",
    "crates/gpui-showcase/android",
    "crates/gpui-showcase/tvos",
    "crates/gpui-themes",
    "crates/gpui-toolkit",
    "crates/gpui-toolkit-cli",
    "crates/gpui-ui-kit",
    "crates/gpui-showcase/ios",
    "crates/gpui-ui-kit-macros",
]
# The vendored font crate has its own workspace; keep it a path dependency.
resolver = "3"

[workspace.package]
version = "0.10.33"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "A toolkit to build portable and fast UI"
edition = "2024"
documentation = "https://docs.rs/gpui-toolkit"
license = "ISC"
repository = "https://github.com/pierreaubert/gpui-toolkit"
keywords = ["gpui", "ui", "visualization"]
categories = ["gui", "visualization"]
readme = "README.md"

[workspace.dependencies]

# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Async and networking
anyhow = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
smol = "2"
urlencoding = "2.1"
reqwest = { version = "0.13", features = ["json"] }

# CLI and system
clap = { version = "4.5", features = ["derive"] }
delaunator = "1.0"
env_logger = "0.11"
log = "0.4.28"
# No deadlock_detection: nothing calls parking_lot::deadlock::*, and the
# feature pulls in backtrace, which does not compile on iOS/tvOS with
# libc >= 0.2.190 (dyld symbols became macOS-only).
parking_lot = { version = "0.12" }
raw-window-handle = "0.6"
regex = "1.12"
tempfile = "3.23"
memmap2 = "0.9.11"
thiserror = "2.0.17"
arrow-array = "57.0.0"
arrow-cast = "57.0.0"
arrow-ipc = "57.0.0"
unicode-segmentation = "1"
stats_alloc = "0.1.10"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "blas", "serde"] }
math-delaunay = { version = "0.5", path = "../math-audio/crates/math-delaunay" }

# GPUI toolkit crates
gpui-au = { path = "crates/gpui-au", version = "0.10" }
gpui-android = { path = "crates/gpui-android", version = "0.10" }
gpui-audio-kit = { path = "crates/gpui-audio-kit", version = "0.10" }
gpui-builder = { path = "crates/gpui-builder", version = "0.10" }
gpui-component-lab = { path = "crates/gpui-component-lab", version = "0.10" }
gpui-d3rs = { path = "crates/gpui-d3rs", version = "0.10", default-features = false }
gpui-design = { path = "crates/gpui-design", version = "0.10" }
gpui-design-tools = { path = "crates/gpui-design-tools", version = "0.10" }
gpui-ios = { path = "crates/gpui-ios", version = "0.10" }
gpui-keybinding = { path = "crates/gpui-keybinding", version = "0.10" }
gpui-layout-expr = { path = "crates/gpui-layout-expr", version = "0.10" }
gpui-miniapp = { path = "crates/gpui-miniapp", version = "0.10" }
gpui-pretext = { path = "crates/gpui-pretext", version = "0.10" }
gpui-profiler = { path = "crates/gpui-profiler", version = "0.10" }
gpui-px = { path = "crates/gpui-px", version = "0.10", default-features = false }
gpui-python-runtime = { path = "crates/gpui-python-runtime", version = "0.10" }
gpui-release-gates = { path = "crates/gpui-release-gates", version = "0.10" }
gpui-scaffolder = { path = "crates/gpui-scaffolder", version = "0.10" }
gpui-showcase = { path = "crates/gpui-showcase", version = "0.10" }
gpui-themes = { path = "crates/gpui-themes", version = "0.10" }
gpui-toolkit = { path = "crates/gpui-toolkit", version = "0.10" }
gpui-toolkit-cli = { path = "crates/gpui-toolkit-cli", version = "0.10" }
gpui-ui-kit = { path = "crates/gpui-ui-kit", version = "0.10" }
gpui-ui-kit-macros = { path = "crates/gpui-ui-kit-macros", version = "0.10" }

# GPUI framework derived from Zed. The dependency keys retain the upstream
# Rust crate names, while package names are namespaced for crates.io.
gpui = { package = "sotf-gpui-toolkit-gpui", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.2.3", default-features = false }
gpui_macros = { package = "sotf-gpui-toolkit-gpui-macros", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
gpui_macos = { package = "sotf-gpui-toolkit-gpui-macos", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.1", default-features = false, features = ["font-kit"] }
gpui_linux = { package = "sotf-gpui-toolkit-gpui-linux", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0", default-features = false }
gpui_windows = { package = "sotf-gpui-toolkit-gpui-windows", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.2", default-features = false }
gpui_wgpu = { package = "sotf-gpui-toolkit-gpui-wgpu", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.2" }
gpui_web = { package = "sotf-gpui-toolkit-gpui-web", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.1" }
wgpu = { package = "sotf-wgpu",  git = "https://github.com/pierreaubert/sotf-3rdparties", version = "29.0.0" }
vello = { package = "sotf-vello", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.10.0", default-features = false, features = ["wgpu"] }
vello_cpu = { version = "0.2.0" }
peniko = { version = "0.6.1" }
kurbo = { version = "0.13.1" }
# GPU-text shaping (reviews/20260906-gpu-text.md Phase 0 spike): bundled
# fonts only — default `system` font enumeration stays off so wasm and
# deterministic screenshots never touch OS font APIs.
parley = { version = "0.11.1", default-features = false, features = ["std"] }
fontique = { version = "0.11.1", default-features = false, features = ["std"] }

# Internal crates derived from Zed, published under the gpui-toolkit namespace.
collections = { package = "sotf-collections",  git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
util = { package = "sotf-gpui-toolkit-util", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.1" }
util_macros = { package = "sotf-gpui-toolkit-util-macros", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
perf = { package = "sotf-gpui-toolkit-perf", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
gpui_util = { package = "sotf-gpui_util",  git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
gpui_shared_string = { package = "sotf-gpui_shared_string",  git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
http_client = { package = "sotf-gpui-toolkit-http-client", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
media = { package = "sotf-media",  git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
scheduler = { package = "sotf-gpui-toolkit-scheduler", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
sum_tree = { package = "sotf-gpui-toolkit-sum-tree", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
refineable = { package = "sotf-refineable",  git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
scap = { git = "https://github.com/pierreaubert/sotf-3rdparties", default-features = false, package = "sotf-zed-scap", version = "0.0.8-zed" }

# Windows crate used by gpui_windows
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
] }
windows-core = "0.62"

# Utilities
approx = "0.5"
criterion = "0.8.2"
itertools = "0.15"
proptest = "1.9"
rand = "0.10.2"
unicode-normalization = "0.1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
lazy_static = "1.4"
bincode = { version = "2.0.1", features = ["serde"] }

# Proc macro dependencies
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.33"
pollster = "1"
wasm-bindgen-futures = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
fontdue = "0.9"
pathfinder_geometry = "0.5"
smallvec = { version = "1.6", features = ["union", "const_new"] }

# Camera and QR examples
qrcode = "0.14"
rqrr = "0.11.0"

# Apple platform bindings
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "=21.0.0"
font-kit = { package = "sotf-zed-font-kit", version = "0.14.1-zed", git = "https://github.com/pierreaubert/sotf-3rdparties", default-features = false, features = ["source"] }
objc = { version = "0.2", package = "sotf-objc", git = "https://github.com/pierreaubert/sotf-3rdparties" }
oslog = "0.2"
security-framework = "3.7"

# Android platform bindings
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
libc = "0.2"
ndk = "0.9"
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash = "2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
# Allowed 2026-10-03: ~280 sites need per-type triage (derive(Debug) does not
# compile for all of them). Follow-up: ratchet per crate toward warn.
missing_debug_implementations = "allow"
# Allowed 2026-10-03: ~240 sites need cfg-aware triage; the flagged import may
# be required by other target cfgs (iOS/tvOS/Android/wasm) that host clippy
# cannot see. Removing them blindly would break cross builds.
redundant_imports = "allow"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
# Allowed 2026-10-03: 115 pre-existing reason-less allows need per-site
# understanding to document. Follow-up: write the reasons, then re-enable so
# new suppressions require justification.
allow_attributes_without_reason = "allow"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
# Allowed 2026-10-03: ~1100 sites of `x.clone()` on Rc/Arc. Pure style churn;
# revisit with a codemod (`Arc::clone(&x)`) once the gate is green.
clone_on_ref_ptr = "allow"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
# Allowed 2026-10-03: 70 sites need error-handling judgment (is the dropped
# error really ignorable?). Follow-up for an error-quality pass.
map_err_ignore = "allow"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
multiple_crate_versions = "allow"
redundant_feature_names = "allow"
manual_checked_ops = "allow"

# Curated 2026-10-03: pedantic lints that are impractical at this codebase's
# scale. Each was firing hundreds-to-thousands of times when workspace
# inheritance was enabled for all first-party crates. They are allowed here so
# the gate stays green and meaningful; the corpus above plus the remaining
# pedantic lints are still enforced. Revisit per lint with a codemod or an
# owner-reviewed ratchet.
# ~4800 sites: bulk #[must_use] is public API churn with call-site cascades.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# ~2100 sites: the project never adopted digit separators; pure churn.
unreadable_literal = "allow"
# ~3100 sites: per-site numeric reasoning across graphics/audio `as` casts.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# ~740 sites: removing async changes public APIs; needs owner review per site.
unused_async = "allow"
# ~480 sites: human prose at scale; needs a docs pass, not a drive-by.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# ~310 sites: splitting functions is refactoring at scale.
too_many_lines = "allow"
# ~160 sites: renames at scale, each needing context judgment.
similar_names = "allow"
# ~100 sites: `Default::default()` -> explicit type; readability churn.
default_trait_access = "allow"
# ~95 sites: needs `fmt::Write` imports that can conflict with `io::Write`.
format_push_string = "allow"
# 82 sites: per-site epsilon reasoning, including DSP semantics. This is a
# correctness lint and the highest-value follow-up in this list.
float_cmp = "allow"
# ~190 sites combined: signature changes are public API breaks.
trivially_copy_pass_by_ref = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
# 72 sites: split arms are often intentional for clarity.
match_same_arms = "allow"
# 66 sites: moving items above statements is code-motion churn.
items_after_statements = "allow"
# 58 sites: x/y/w/h/i/j are idiomatic in math/graphics code.
many_single_char_names = "allow"
# 31 sites: bool-field redesign is API redesign at scale.
struct_excessive_bools = "allow"
# 234 sites: expanding globs is only sound for the compiled cfg/feature set;
# names used solely under other cfgs (iOS/wasm/Android) or features would be
# dropped and break those builds. Needs per-crate rollout + cross-matrix CI.
wildcard_imports = "allow"
# 236 sites: the lint is bidirectional in this toolchain (fires on both
# `assert_eq!(x, [])` and `assert!(x.is_empty())`), and its machine suggestions
# demonstrably break compilation (E0282 inference failures, E0433 unresolvable
# paths, unsound `.as_slice()` insertion). Allowed 2026-10-03 until the
# suggestions are sound; revisit with a codemod then.
assert_is_empty = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

# Fix: git font-kit rev lacks tvOS target cfgs and has broken core-text imports;
# use the vendored manifest with Apple mobile target fixes.

[patch.crates-io]
# SOTF owned maintenance forks; upstream 2.1.1, local version 2.1.2.

# Bridge patch: the git scheduler rev still depends on backtrace 0.3
# unconditionally, which does not compile on Apple mobile targets with
# libc >= 0.2.190. Use the local checkout, which target-gates the dep
# (see gpui/crates/scheduler/VENDORED.md). Remove this once the fix is
# committed in sotf-3rdparties and the lock moves past it.
[patch."https://github.com/pierreaubert/sotf-3rdparties"]
sotf-gpui-toolkit-scheduler = { path = "../sotf-3rdparties/gpui/crates/scheduler" }

# vello 0.10 requires crates-io wgpu/naga 29.0.3; unify with Zed's fork
# (fork = upstream v29.0.3 + one internal wgpu-hal EGL patch, version-identical).

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility. Compile time stays in the few-minute
# range on typical hardware.
lto = "thin"
codegen-units = 14
panic = "unwind"  # Changed from "abort" to allow tests to run
# debug = true # Keeps debug symbols for profiling

# `dist` is the "cut a release" profile. Inherits everything from `release`
# (including panic=unwind) and tightens for maximum runtime performance at the
# cost of much longer compile time. Use via `cargo build --profile dist` —
# artifacts land in `target/dist/` instead of `target/release/`. The Justfile
# `dist-*` recipes wrap this for the shipping binaries.
#
# Tradeoffs vs `release`:
#   - lto = "fat"           — whole-program LTO across all crates. Serial,
#                             single-threaded final link; typically 5-10x
#                             slower than thin LTO. Worth it for the binary
#                             that ships to users.
#   - codegen-units = 1     — single codegen unit per crate maximises the
#                             optimiser's view, enables aggressive inlining
#                             and dead-code elimination.
#   - incremental = false   — incremental cache is useless for a release cut
#                             and can suppress some optimisations.
#   - strip is intentionally NOT set; macOS distribution scripts run
#     `dsymutil` before stripping so they can ship .dSYM bundles for crash
#     symbolication. Linux scripts strip with `strip -v` post-build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Explicit size-optimised profile for measuring and shipping small desktop
# binaries. It preserves unwind semantics for plugin/host panic boundaries,
# but strips the final executable and lets LLVM optimise for size.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
