[workspace]
members = [
    "crates/gpui-au",
    "crates/gpui-audio-kit",
    "crates/gpui-builder",
    "crates/gpui-component-lab",
    "crates/gpui-d3rs",
    "crates/gpui-design",
    "crates/gpui-design-tools",
    "crates/gpui-ios",
    "crates/gpui-keybinding",
    "crates/gpui-miniapp",
    "crates/gpui-pretext",
    "crates/gpui-profiler",
    "crates/gpui-px",
    "crates/gpui-python-runtime",
    "crates/gpui-scaffolder",
    "crates/gpui-themes",
    "crates/gpui-ui-kit",
    "crates/gpui-ui-kit/ios",
    "crates/gpui-ui-kit-macros",
]
resolver = "3"

[workspace.package]
version = "0.8.2"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Optimise the sound of your speakers or your headphones"
edition = "2024"
documentation = "https://docs.rs/gpui-toolkit"
license = "ISC"
repository = "https://github.com/pierreaubert/gpui-toolkit"
keywords = ["gpui", "ui", "visualization"]
categories = ["gui", "visualization"]
readme = "README.md"

[workspace.dependencies]

# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Async and networking
anyhow = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
smol = "2"
urlencoding = "2.1"
reqwest = { version = "0.13", features = ["json"] }

# CLI and system
clap = { version = "4.5", features = ["derive"] }
delaunator = "1.0"
env_logger = "0.11"
log = "0.4"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
raw-window-handle = "0.6"
regex = "1.12"
tempfile = "3.23"
thiserror = "2.0.17"
unicode-segmentation = "1"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "blas", "serde"] }
autoeq = { version = ">=0.4" }
autoeq-cea2034 = { version = "0.4" }
math-delaunay = "0.5"

# GPUI toolkit crates
gpui-au = { path = "crates/gpui-au", version = "0.8" }
gpui-audio-kit = { path = "crates/gpui-audio-kit", version = "0.8" }
gpui-builder = { path = "crates/gpui-builder", version = "0.8" }
gpui-component-lab = { path = "crates/gpui-component-lab", version = "0.8" }
gpui-d3rs = { path = "crates/gpui-d3rs", version = "0.8", default-features = false }
gpui-design = { path = "crates/gpui-design", version = "0.8" }
gpui-design-tools = { path = "crates/gpui-design-tools", version = "0.8" }
gpui-ios = { path = "crates/gpui-ios", version = "0.8" }
gpui-keybinding = { path = "crates/gpui-keybinding", version = "0.8" }
gpui-miniapp = { path = "crates/gpui-miniapp" }
gpui-pretext = { path = "crates/gpui-pretext", version = "0.8" }
gpui-profiler = { path = "crates/gpui-profiler", version = "0.8" }
gpui-px = { path = "crates/gpui-px", version = "0.8", default-features = false }
gpui-python-runtime = { path = "crates/gpui-python-runtime", version = "0.8" }
gpui-scaffolder = { path = "crates/gpui-scaffolder", version = "0.8" }
gpui-themes = { path = "crates/gpui-themes", version = "0.8" }
gpui-ui-kit = { path = "crates/gpui-ui-kit", version = "0.8" }
gpui-ui-kit-macros = { path = "crates/gpui-ui-kit-macros", version = "0.8" }

# GPUI framework - all packages must use the same Zed tag.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
gpui_macros = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
gpui_macos = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0", features = ["font-kit"] }
gpui_linux = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
gpui_windows = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
gpui_wgpu = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.0.0" }
wgpu = { version = "29.0.0", git = "https://github.com/zed-industries/wgpu.git", branch = "v29" }

# Utilities
approx = "0.5"
criterion = "0.5"
proptest = "1.9"
unicode-normalization = "0.1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
lazy_static = "1.4"
bincode = { version = "2.0.1", features = ["serde"] }

# Proc macro dependencies
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.30"
pollster = "0.4"
image = "0.25"
fontdue = "0.9"
pathfinder_geometry = "0.5"
smallvec = { version = "1.6", features = ["union", "const_new"] }

# Camera and QR examples
nokhwa = { version = "0.10", default-features = false }
qrcode = "0.14"
rqrr = "0.10.0"

# Apple platform bindings
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "=21.0.0"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5" }
objc = "0.2"
oslog = "0.2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
multiple_crate_versions = "allow"
manual_checked_ops = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

# Fix: git font-kit rev has broken core-text imports; use crates.io version
[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = "0.14.1-zed"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"  # Changed from "abort" to allow tests to run

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
