[workspace]
members = [
    "crates/gpui-au",
    "crates/gpui-android",
    "crates/gpui-audio-kit",
    "crates/gpui-builder",
    "crates/gpui-component-lab",
    "crates/gpui-d3rs",
    "crates/gpui-design",
    "crates/gpui-design-tools",
    "crates/gpui-hello-web",
    "crates/gpui-ios",
    "crates/gpui-keybinding",
    "crates/gpui-miniapp",
    "crates/gpui-pretext",
    "crates/gpui-profiler",
    "crates/gpui-px",
    "crates/gpui-python-runtime",
    "crates/gpui-scaffolder",
    "crates/gpui-showcase",
    "crates/gpui-showcase/android",
    "crates/gpui-showcase/tvos",
    "crates/gpui-themes",
    "crates/gpui-toolkit",
    "crates/gpui-ui-kit",
    "crates/gpui-showcase/ios",
    "crates/gpui-ui-kit-macros",
    "crates/3rdparties/gpui_wgpu",
    "crates/3rdparties/gpui_web",
    "crates/3rdparties/gpui_windows",
    "crates/3rdparties/gpui",
    "crates/3rdparties/gpui_macros",
    "crates/3rdparties/gpui_macos",
    "crates/3rdparties/gpui_linux",
    "crates/3rdparties/collections",
    "crates/3rdparties/util",
    "crates/3rdparties/gpui_shared_string",
    "crates/3rdparties/gpui_util",
    "crates/3rdparties/util_macros",
    "crates/3rdparties/refineable",
    "crates/3rdparties/derive_refineable",
    "crates/3rdparties/scheduler",
    "crates/3rdparties/sum_tree",
    "crates/3rdparties/http_client",
    "crates/3rdparties/media",
    "crates/3rdparties/perf",
]
resolver = "3"

[workspace.package]
version = "0.9.22"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "A toolkit to build portable and fast UI"
edition = "2024"
documentation = "https://docs.rs/gpui-toolkit"
license = "ISC"
repository = "https://github.com/pierreaubert/gpui-toolkit"
keywords = ["gpui", "ui", "visualization"]
categories = ["gui", "visualization"]
readme = "README.md"

[workspace.dependencies]

# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Async and networking
anyhow = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
smol = "2"
urlencoding = "2.1"
reqwest = { version = "0.13", features = ["json"] }

# CLI and system
clap = { version = "4.5", features = ["derive"] }
delaunator = "1.0"
env_logger = "0.11"
log = "0.4.28"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
raw-window-handle = "0.6"
regex = "1.12"
tempfile = "3.23"
thiserror = "2.0.17"
unicode-segmentation = "1"
stats_alloc = "0.1.10"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "blas", "serde"] }
autoeq = { version = ">=0.4" }
autoeq-cea2034 = { version = "0.4" }
math-delaunay = "0.5"

# GPUI toolkit crates
gpui-au = { path = "crates/gpui-au", version = "0.9" }
gpui-android = { path = "crates/gpui-android", version = "0.9" }
gpui-audio-kit = { path = "crates/gpui-audio-kit", version = "0.9" }
gpui-builder = { path = "crates/gpui-builder", version = "0.9" }
gpui-component-lab = { path = "crates/gpui-component-lab", version = "0.9" }
gpui-d3rs = { path = "crates/gpui-d3rs", version = "0.9", default-features = false }
gpui-design = { path = "crates/gpui-design", version = "0.9" }
gpui-design-tools = { path = "crates/gpui-design-tools", version = "0.9" }
gpui-ios = { path = "crates/gpui-ios", version = "0.9" }
gpui-keybinding = { path = "crates/gpui-keybinding", version = "0.9" }
gpui-miniapp = { path = "crates/gpui-miniapp", version = "0.9" }
gpui-pretext = { path = "crates/gpui-pretext", version = "0.9" }
gpui-profiler = { path = "crates/gpui-profiler", version = "0.9" }
gpui-px = { path = "crates/gpui-px", version = "0.9", default-features = false }
gpui-python-runtime = { path = "crates/gpui-python-runtime", version = "0.9" }
gpui-scaffolder = { path = "crates/gpui-scaffolder", version = "0.9" }
gpui-showcase = { path = "crates/gpui-showcase", version = "0.9" }
gpui-themes = { path = "crates/gpui-themes", version = "0.9" }
gpui-toolkit = { path = "crates/gpui-toolkit", version = "0.9" }
gpui-ui-kit = { path = "crates/gpui-ui-kit", version = "0.9" }
gpui-ui-kit-macros = { path = "crates/gpui-ui-kit-macros", version = "0.9" }

# GPUI framework derived from Zed. The dependency keys retain the upstream
# Rust crate names, while package names are namespaced for crates.io.
gpui = { package = "gpui-toolkit-gpui", path = "crates/3rdparties/gpui", version = "0.2.3", default-features = false }
gpui_macros = { package = "gpui-toolkit-gpui-macros", path = "crates/3rdparties/gpui_macros", version = "0.1.0" }
gpui_macos = { package = "gpui-toolkit-gpui-macos", path = "crates/3rdparties/gpui_macos", version = "0.1.1", default-features = false, features = ["font-kit"] }
gpui_linux = { package = "gpui-toolkit-gpui-linux", path = "crates/3rdparties/gpui_linux", version = "0.1.0", default-features = false }
gpui_windows = { package = "gpui-toolkit-gpui-windows", path = "crates/3rdparties/gpui_windows", version = "0.1.2", default-features = false }
gpui_wgpu = { package = "gpui-toolkit-gpui-wgpu", path = "crates/3rdparties/gpui_wgpu", version = "0.1.2" }
gpui_web = { package = "gpui-toolkit-gpui-web", path = "crates/3rdparties/gpui_web", version = "0.1.1" }
wgpu = { version = "29.0.0", git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
vello = { version = "0.10.0", default-features = false, features = ["wgpu"] }
vello_cpu = { version = "0.2.0" }
peniko = { version = "0.6.1" }
kurbo = { version = "0.13.1" }

# Internal crates derived from Zed, published under the gpui-toolkit namespace.
collections = { package = "gpui-toolkit-collections", path = "crates/3rdparties/collections", version = "0.1.0" }
util = { package = "gpui-toolkit-util", path = "crates/3rdparties/util", version = "0.1.1" }
util_macros = { package = "gpui-toolkit-util-macros", path = "crates/3rdparties/util_macros", version = "0.1.0" }
perf = { package = "gpui-toolkit-perf", path = "crates/3rdparties/perf", version = "0.1.0" }
gpui_util = { package = "gpui-toolkit-gpui-util", path = "crates/3rdparties/gpui_util", version = "0.1.0" }
gpui_shared_string = { package = "gpui-toolkit-gpui-shared-string", path = "crates/3rdparties/gpui_shared_string", version = "0.1.0" }
http_client = { package = "gpui-toolkit-http-client", path = "crates/3rdparties/http_client", version = "0.1.0" }
media = { package = "gpui-toolkit-media", path = "crates/3rdparties/media", version = "0.1.0" }
scheduler = { package = "gpui-toolkit-scheduler", path = "crates/3rdparties/scheduler", version = "0.1.0" }
sum_tree = { package = "gpui-toolkit-sum-tree", path = "crates/3rdparties/sum_tree", version = "0.1.0" }
refineable = { package = "gpui-toolkit-refineable", path = "crates/3rdparties/refineable", version = "0.1.0" }
derive_refineable = { package = "gpui-toolkit-derive-refineable", path = "crates/3rdparties/derive_refineable", version = "0.1.0" }
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }

# Windows crate used by gpui_windows
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
] }
windows-core = "0.62"

# Utilities
approx = "0.5"
criterion = "0.8"
itertools = "0.15"
proptest = "1.9"
rand = "0.10.2"
unicode-normalization = "0.1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
lazy_static = "1.4"
bincode = { version = "2.0.1", features = ["serde"] }

# Proc macro dependencies
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.33"
pollster = "1"
wasm-bindgen-futures = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
fontdue = "0.9"
pathfinder_geometry = "0.5"
smallvec = { version = "1.6", features = ["union", "const_new"] }

# Camera and QR examples
qrcode = "0.14"
rqrr = "0.10.0"

# Apple platform bindings
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "=21.0.0"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", default-features = false, features = ["source"] }
objc = "0.2"
oslog = "0.2"
security-framework = "3.7"

# Android platform bindings
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
libc = "0.2"
ndk = "0.9"
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash = "2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
multiple_crate_versions = "allow"
redundant_feature_names = "allow"
manual_checked_ops = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

# Fix: git font-kit rev lacks tvOS target cfgs and has broken core-text imports;
# use the vendored manifest with Apple mobile target fixes.
[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { path = "crates/3rdparties/zed-font-kit" }

[patch.crates-io]
block = { path = "crates/3rdparties/block" }
objc = { path = "crates/3rdparties/objc" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# vello 0.10 requires crates-io wgpu/naga 29.0.3; unify with Zed's fork
# (fork = upstream v29.0.3 + one internal wgpu-hal EGL patch, version-identical).
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-hal = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-types = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
naga = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility. Compile time stays in the few-minute
# range on typical hardware.
lto = "thin"
codegen-units = 14
panic = "unwind"  # Changed from "abort" to allow tests to run
# debug = true # Keeps debug symbols for profiling

# `dist` is the "cut a release" profile. Inherits everything from `release`
# (including panic=unwind) and tightens for maximum runtime performance at the
# cost of much longer compile time. Use via `cargo build --profile dist` —
# artifacts land in `target/dist/` instead of `target/release/`. The Justfile
# `dist-*` recipes wrap this for the shipping binaries.
#
# Tradeoffs vs `release`:
#   - lto = "fat"           — whole-program LTO across all crates. Serial,
#                             single-threaded final link; typically 5-10x
#                             slower than thin LTO. Worth it for the binary
#                             that ships to users.
#   - codegen-units = 1     — single codegen unit per crate maximises the
#                             optimiser's view, enables aggressive inlining
#                             and dead-code elimination.
#   - incremental = false   — incremental cache is useless for a release cut
#                             and can suppress some optimisations.
#   - strip is intentionally NOT set; macOS distribution scripts run
#     `dsymutil` before stripping so they can ship .dSYM bundles for crash
#     symbolication. Linux scripts strip with `strip -v` post-build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Explicit size-optimised profile for measuring and shipping small desktop
# binaries. It preserves unwind semantics for plugin/host panic boundaries,
# but strips the final executable and lets LLVM optimise for size.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
