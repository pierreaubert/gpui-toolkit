name: WASM Demo Gallery

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "crates/gpui-showcase/**"
      - "crates/gpui-px/**"
      - "crates/gpui-miniapp/**"
      - "../sotf-3rdparties/gpui/crates/gpui_web/**"
      - "scripts/build_wasm_demo_gallery.py"
      - "scripts/qa_wasm_screenshot.py"
      - "docs/demos/**"
      - "builds/wasm.just"
      - ".github/workflows/demos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_BUILD_STD: std,panic_abort
  RUST_BACKTRACE: 1

jobs:
  capture:
    name: Capture WASM gallery
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install just and Trunk
        run: |
          brew install just
          cargo install trunk --locked

      - name: Install uv and browser capture dependencies
        uses: astral-sh/setup-uv@v7

      - name: Install Chromium for WebGPU capture
        run: uv run --with playwright playwright install chromium

      - name: Cache Rust and browser builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-gallery-${{ hashFiles('**/Cargo.lock') }}

      - name: Build live WASM routes
        run: just wasm-build-site

      - name: Capture snapshots and generate gallery
        run: just wasm-gallery

      # The gallery site is hosted externally at
      # https://gpui-toolkit.spinorama.org/ with no automatic push: publish
      # it manually from this artifact or a local `just demo-site` build.
      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-demo-gallery
          path: target/demo-site/
          if-no-files-found: error
          retention-days: 14
