name: WASM Demo Gallery

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "crates/gpui-showcase/**"
      - "crates/gpui-px/**"
      - "crates/gpui-d3rs/**"
      - "crates/gpui-spinorama/**"
      - "crates/gpui-scene3d/**"
      - "crates/gpui-mesh/**"
      - "crates/gpui-dataset-transformation/**"
      - "crates/gpui-miniapp/**"
      - "crates/gpui-hello-web/**"
      - "crates/assets/fonts/**"
      - "../sotf-3rdparties/gpui/crates/gpui_web/**"
      - "scripts/build_wasm_demo_gallery.py"
      - "scripts/qa_wasm_screenshot.py"
      - "scripts/qa_spinorama_browser.py"
      - "scripts/serve_demo_site.py"
      - "scripts/qa_chess_content.py"
      - "scripts/qa_showcase_native_wasm.py"
      - "scripts/qa_wasm_renderer_parity.py"
      - "scripts/tests/**"
      - "docs/demos/**"
      - "builds/wasm.just"
      - ".github/workflows/demos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_BUILD_STD: std,panic_abort
  RUST_BACKTRACE: 1

jobs:
  capture:
    name: Capture WASM gallery
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install just and Trunk
        run: |
          brew install just
          cargo install trunk

      - name: Install uv and browser capture dependencies
        uses: astral-sh/setup-uv@v7

      - name: Install Chromium for WebGPU capture
        run: uv run --with playwright playwright install chromium

      - name: Cache Rust and browser builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-gallery-${{ hashFiles('**/Cargo.lock') }}

      - name: Test gallery and visual QA checks
        env:
          PYTHONPATH: scripts
        run: |
          uv run --with pillow --with playwright python -m unittest discover -s scripts/tests -p 'test_*wasm*.py'
          uv run --with pillow --with playwright python -m unittest discover -s scripts/tests -p 'test_qa_chess_content.py'

      - name: Build live WASM routes
        run: just wasm-build-site

      - name: Verify full Spinorama browser content and 3D interaction
        run: |
          python3 scripts/serve_demo_site.py --port 8090 > /tmp/gpui-demo-server.log 2>&1 &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid"' EXIT
          uv run --with pillow --with playwright python scripts/qa_spinorama_browser.py

      - name: Capture snapshots and generate gallery
        run: just wasm-gallery

      # The gallery site is hosted externally at
      # https://gpui-toolkit.spinorama.org/ with no automatic push: publish
      # it manually from this artifact or a local `just demo-site` build.
      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-demo-gallery
          path: target/demo-site/
          if-no-files-found: error
          retention-days: 14
