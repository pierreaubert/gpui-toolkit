name: Python package

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Match the native minimum in .cargo/config.toml and the wheel tags below.
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  build:
    name: Build wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            # PyPI rejects the generic `linux_x86_64` tag.  This host is built
            # on Ubuntu 24.04 and requires glibc 2.39, so declare its actual
            # PEP 600 compatibility floor.
            platform_tag: manylinux_2_39_x86_64
            host: target/release/gpui-python-host
            build_fallback: true
          - os: macos-15
            platform: macos-arm64
            platform_tag: macosx_15_0_arm64
            host: target/release/gpui-python-host
            build_fallback: false
          - os: macos-15-intel
            platform: macos-x86_64
            platform_tag: macosx_15_0_x86_64
            host: target/release/gpui-python-host
            build_fallback: false
          - os: windows-latest
            platform: windows-x86_64
            platform_tag: win_amd64
            host: target/release/gpui-python-host.exe
            build_fallback: false

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install package metadata for tests
        run: |
          python -m pip uninstall --yes gpui-toolkit
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev
      - name: Verify Python declaration surface
        # Integrity check only: --strict also requires
        # surface.release_ready, which the manifest keeps false until the
        # rustdoc classification waves close (see python-surface.toml).
        # Re-enable --strict when release_ready flips.
        run: python scripts/check_python_surface.py
      - name: Run Python declaration tests
        env:
          PYTHONPATH: crates/gpui-python-runtime/python
        run: python -m unittest discover -s crates/gpui-python-runtime/python/tests -p 'test_*.py'
      - name: Verify package version parity
        run: python scripts/sync_versions.py --check
      - name: Build native host
        env:
          # RUSTFLAGS replaces target config flags; target-specific env flags
          # merge with them and would retain the local mold requirement.
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C symbol-mangling-version=v0' || '' }}
        run: cargo build -p gpui-python-runtime --features showcase --bin gpui-python-host --release
      - name: Build wheel with bundled host
        run: python scripts/build_python_package.py --host "${{ matrix.host }}" --platform-tag "${{ matrix.platform_tag }}"
      - name: Build declarations-only fallback wheel
        if: matrix.build_fallback
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Verify bundled wheel
        run: >-
          python -c "import glob, subprocess, sys; wheel = glob.glob('dist/*-${{ matrix.platform_tag }}.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target', 'wheel-check', wheel]); sys.path.insert(0, 'wheel-check'); from gpui_toolkit.app import _host_binary; host = _host_binary(); assert host and host.endswith(('gpui-python-host', 'gpui-python-host.exe')); print(host)"
      - uses: actions/upload-artifact@v5
        with:
          name: gpui-toolkit-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify release tag matches package version
        run: python scripts/sync_versions.py --check --tag "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v5
        with:
          pattern: gpui-toolkit-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
