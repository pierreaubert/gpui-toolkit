name: Python package

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            platform_tag: linux_x86_64
            host: target/release/gpui-python-host
          - os: macos-14
            platform: macos-arm64
            platform_tag: macosx_14_0_arm64
            host: target/release/gpui-python-host
          - os: macos-13
            platform: macos-x86_64
            platform_tag: macosx_10_13_x86_64
            host: target/release/gpui-python-host
          - os: windows-latest
            platform: windows-x86_64
            platform_tag: win_amd64
            host: target/release/gpui-python-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev

      - name: Build native host
        run: cargo build -p gpui-python-runtime --features showcase --bin gpui-python-host --release

      - name: Build wheel with bundled host
        run: python scripts/build_python_package.py --host "${{ matrix.host }}" --platform-tag "${{ matrix.platform_tag }}"

      - name: Build universal declarations-only fallback wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Verify wheel contains a usable host
        run: |
          python -c "import glob, subprocess, sys; wheel = glob.glob('dist/*-${{ matrix.platform_tag }}.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target', 'wheel-check', wheel])"
          python -c "import sys; sys.path.insert(0, 'wheel-check'); from gpui_toolkit.app import _host_binary; host = _host_binary(); assert host and host.endswith(('gpui-python-host', 'gpui-python-host.exe')); print(host)"

      - uses: actions/upload-artifact@v4
        with:
          name: gpui-toolkit-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gpui-toolkit-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
