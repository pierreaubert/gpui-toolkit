name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  platform-check:
    name: Platform compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-platform-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace targets without warnings
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding

      - name: Test portable workspace
        # Scaffolder contract tests invoke Apple/nightly targets and belong to
        # dedicated platform lanes, not the portable desktop matrix.
        run: cargo test --workspace --exclude gpui-scaffolder --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding

      - name: Install iOS simulator Rust target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios-sim

      - name: Check generated iOS simulator scaffold
        if: runner.os == 'macOS'
        run: cargo test -p gpui-scaffolder scaffolded_project_passes_ios_simulator_cargo_check

  mobile-platform-check:
    name: Mobile backend compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
            target: aarch64-apple-ios-sim
          - platform: android
            os: ubuntu-latest
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        if: matrix.platform == 'android'
        run: sdkmanager "ndk;27.2.12479018"

      - name: Check iOS backend and target-gated tests
        if: matrix.platform == 'ios'
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p gpui-ios --tests --target aarch64-apple-ios-sim

      - name: Check Android backend and showcase host
        if: matrix.platform == 'android'
        env:
          RUSTFLAGS: -D warnings
        run: |
          export CC_aarch64_linux_android="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CXX_aarch64_linux_android="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          export AR_aarch64_linux_android="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo check -p gpui-showcase-android --target aarch64-linux-android --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding

      - name: Compile canonical Android Activity host
        if: matrix.platform == 'android'
        working-directory: crates/gpui-showcase/android/gradle
        run: ./gradlew compileDebugJavaWithJavac

  wasm-check:
    name: wasm32 compile (web backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Check web backend crates
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: cargo check --target wasm32-unknown-unknown -p gpui_web -p gpui-miniapp -p gpui-hello-web -p gpui-showcase -p gpui-px -p gpui-d3rs

  apple-extension-check:
    name: Apple extension backend (AUv3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test AU rendering and keyboard/text FFI
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test -p gpui-au
          clang -fsyntax-only -x c crates/gpui-au/include/gpui_au.h

  tvos-platform-check:
    name: tvOS backend compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly with Rust sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Compile tvOS simulator backend
        env:
          RUSTFLAGS: -D warnings
        run: cargo +nightly check -p gpui-ios --target aarch64-apple-tvos-sim -Zbuild-std=std,panic_abort

  native-ui-smoke:
    name: Native GPUI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-ui-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux virtual display and software renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            xauth \
            xdotool \
            imagemagick \
            libgl1-mesa-dri \
            mesa-vulkan-drivers

      - name: Install macOS screenshot tooling
        if: runner.os == 'macOS'
        run: brew install imagemagick

      - name: Build layout showcase
        run: cargo build -p gpui-builder --features showcase --bin layout-showcase

      - name: Exercise GPUI interaction contracts
        run: cargo test -p gpui-builder --features showcase --bin layout-showcase

      - name: Run Linux native UI smoke
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a bash scripts/run_linux_native_ui_smoke.sh \
            target/debug/layout-showcase \
            target/qa/native-ui/linux/gpui-builder-smoke.json \
            target/qa/native-ui/linux/gpui-builder.png

      - name: Run macOS native UI smoke
        if: runner.os == 'macOS'
        run: |
          bash scripts/run_macos_native_ui_smoke.sh \
            target/debug/layout-showcase \
            target/qa/native-ui/macos/gpui-builder-smoke.json \
            target/qa/native-ui/macos/gpui-builder.png

      - name: Run Windows native UI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          target/debug/layout-showcase.exe `
            --smoke-test `
            --smoke-artifact target/qa/native-ui/windows/gpui-builder-smoke.json

      - name: Upload native UI smoke evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-smoke-${{ runner.os }}
          path: target/qa/native-ui/
          if-no-files-found: error

  check-and-test:
    name: Check, Clippy and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: just check

      - name: cargo clippy
        run: just lint

      - name: cargo test
        # gpui-scaffolder contains platform-specific tests (tvOS simulator
        # cargo check) that require nightly + Apple targets; exclude it from the
        # ubuntu CI run.
        run: cargo test --workspace --exclude gpui-scaffolder --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding

      - name: QA script contracts
        run: just qa-scripts

  nextest:
    name: Nextest (workspace)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run nextest
        run: cargo nextest run --profile ci --no-fail-fast --workspace --exclude gpui-scaffolder --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding

  miri-pretext:
    name: Miri (gpui-pretext)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Initialize Miri
        run: cargo miri setup

      - name: Exercise portable text layout under Miri
        run: cargo miri test -p gpui-pretext --lib --tests

  dependency-policy:
    name: Dependency, license and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check cargo-deny policy
        uses: EmbarkStudios/cargo-deny-action@v2

  public-api:
    name: Semver (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These crates do not require the unpublished upstream GPUI package,
        # so crates.io can provide a meaningful baseline comparison.
        # gpui-profiler joins after its first registry release creates a baseline.
        package: [gpui-design, gpui-pretext, gpui-ui-kit-macros]
    steps:
      - uses: actions/checkout@v7

      - name: Check public API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ${{ matrix.package }}

  public-msrv:
    name: Public GPUI-free MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check minimal public crates and all their targets
        run: cargo check -p gpui-design -p gpui-pretext -p gpui-profiler -p gpui-ui-kit-macros --all-targets

  public-api-contracts:
    name: Minimal features, rustdoc and generated scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Run public API contracts
        run: just qa-api

  release-contract:
    name: Governance and locked registry packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Verify public release contract
        run: just qa-release-contract

  qa-gpui-obvious:
    name: GPUI Obvious QA Gate
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run GPUI obvious QA
        run: just qa-gpui-obvious

      - name: Upload desktop accessibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-accessibility-evidence
          path: target/qa/accessibility/
          if-no-files-found: error

  visual-evidence:
    name: Linux visual and native evidence
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install Linux native visual capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-visual-${{ hashFiles('**/Cargo.lock') }}

      - name: Run visual manifests, goldens and conformance
        env:
          QA_NATIVE_UI_CAPTURE: "1"
        run: just qa-visual

      - name: Upload visual evidence and pending-renderer report
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence
          path: target/qa/visual/
          if-no-files-found: error

  visual-renderer-metal:
    name: Metal renderer snapshots (200 cases)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just and baseline decompressor
        run: brew install just zstd

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metal-visual-${{ hashFiles('**/Cargo.lock', 'qa/visual/baselines/*') }}

      - name: Capture and compare representative Metal snapshots
        env:
          QA_NATIVE_UI_CAPTURE: "0"
          QA_VISUAL_CAPTURE_LIMIT: "200"
        run: just qa-visual

      - name: Upload Metal captures, diffs, reports, and contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-metal
          path: target/qa/visual/
          if-no-files-found: error

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage report
        # gpui-scaffolder is excluded because its tvOS simulator test requires
        # Apple targets and nightly that are not available on ubuntu-latest.
        run: |
          cargo llvm-cov --workspace --exclude gpui-scaffolder --all-targets \
            --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding \
            --html --output-dir target/qa/cov/html \
            --ignore-filename-regex '.*/(tests|benches|examples|target|crates/3rdparties|crates/gpui-au|crates/gpui-android|crates/gpui-ios|crates/gpui-miniapp|crates/.*/bin)/.*'

      - name: Enforce coverage ratchet
        run: |
          cargo llvm-cov --workspace --exclude gpui-scaffolder --all-targets \
            --features autoeq,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding \
            --json --summary-only --output-path target/qa/cov/summary.json \
            --ignore-filename-regex '.*/(tests|benches|examples|target|crates/3rdparties|crates/gpui-au|crates/gpui-android|crates/gpui-ios|crates/gpui-miniapp|crates/.*/bin)/.*'
          python3 scripts/qa_cov_check.py \
            --summary target/qa/cov/summary.json \
            --threshold 73.5 \
            --output target/qa/cov/report.md \
            --ignore-regex '.*/(tests|benches|examples|target|crates/3rdparties|crates/gpui-au|crates/gpui-android|crates/gpui-ios|crates/gpui-miniapp|crates/.*/bin)/.*'

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/qa/cov/
          if-no-files-found: warn

  performance-regression:
    name: Performance regression (same-runner base comparison)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo and Criterion data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
      - name: Resolve comparison revision
        id: base
        env:
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Benchmark base revision on this runner
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/gpui-perf-base" "$BASE_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/gpui-perf-base-target" \
            python3 "$RUNNER_TEMP/gpui-perf-base/scripts/qa_perf_baseline.py" \
              --output "$GITHUB_WORKSPACE/target/qa/perf/base-current-runner.json"

      - name: Benchmark candidate and enforce ratchet
        run: |
          python3 scripts/qa_perf_baseline.py \
            --output target/qa/perf/current.json
          python3 scripts/qa_perf_check.py \
            --baseline target/qa/perf/base-current-runner.json \
            --current target/qa/perf/current.json \
            --threshold 20 \
            --noise-floor-ns 150 \
            --output target/qa/perf/report.md
      - name: Upload performance evidence
        uses: actions/upload-artifact@v7
        with:
          name: performance-regression
          path: target/qa/perf/
          if-no-files-found: error
