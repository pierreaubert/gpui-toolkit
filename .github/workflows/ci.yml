name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Check, Clippy and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: just check

      - name: cargo clippy
        run: just lint

      - name: cargo test
        # gpui-scaffolder contains platform-specific tests (tvOS simulator
        # cargo check) that require nightly + Apple targets; exclude it from the
        # ubuntu CI run.
        run: cargo test --workspace --exclude gpui-scaffolder --features autoeq,camera,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding

  qa-gpui-obvious:
    name: GPUI Obvious QA Gate
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run GPUI obvious QA
        run: just qa-gpui-obvious

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage report
        # gpui-scaffolder is excluded because its tvOS simulator test requires
        # Apple targets and nightly that are not available on ubuntu-latest.
        run: |
          cargo llvm-cov --workspace --exclude gpui-scaffolder --all-targets \
            --features autoeq,camera,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding \
            --html --output-dir target/qa/cov/html \
            --ignore-filename-regex '.*/(tests|benches|examples|target|crates/3rdparties|crates/gpui-au|crates/gpui-android|crates/gpui-ios|crates/gpui-miniapp|crates/.*/bin)/.*'
          cargo llvm-cov --workspace --exclude gpui-scaffolder --all-targets \
            --features autoeq,camera,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding \
            --json --summary-only --output-path target/qa/cov/summary.json \
            --ignore-filename-regex '.*/(tests|benches|examples|target|crates/3rdparties|crates/gpui-au|crates/gpui-android|crates/gpui-ios|crates/gpui-miniapp|crates/.*/bin)/.*'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/qa/cov/
          if-no-files-found: warn
