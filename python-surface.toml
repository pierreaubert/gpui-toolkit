# The initial conformance entries are the already-shipped simulation surface.
# New public Python APIs must add their disposition and test in the same change.
[[capability]]
id = "gpui-python-runtime.app"
rust_path = "gpui_python_runtime::session"
python_path = "gpui_toolkit.App"
disposition = "direct"
tests = ["crates/gpui-python-runtime/python/tests/test_state.py"]

[[capability]]
id = "gpui-ui-kit.declarative"
rust_path = "gpui_ui_kit"
