# Checked-in inventory for the Python parity gate described in
# gpui-toolkit-python-full-surface-design.md.  This registry is deliberately
# separate from the wire schema: it records the disposition that every public
# capability must eventually receive.

[surface]
schema_version = 1
aggregate_crate = "gpui-toolkit"
aggregate_feature = "all"
rustdoc_inventory = "python-rustdoc-inventory.json"
rustdoc_packages = ["gpui-d3rs", "gpui-px"]
rustdoc_inventory_digest = "b3b2254945a4a5050eef7a080395487eaa00183152dd08d44797a3173bd9a0ea"
# Stable 2.0 cannot be declared while full rustdoc-inventory classification and
# the remaining targeted-crate inventory waves are open.
release_ready = false

[[rustdoc_classification_rule]]
id = "gpui-d3rs.examples"
package = "gpui-d3rs"
path_prefix = "d3rs::examples"
disposition = "intentionally-excluded"
rationale = "Example and showcase APIs are applications, not reusable Python runtime bindings."

