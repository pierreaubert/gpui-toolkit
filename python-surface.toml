# Checked-in inventory for the Python parity gate described in
# gpui-toolkit-python-full-surface-design.md.  This registry is deliberately
# separate from the wire schema: it records the disposition that every public
# capability must eventually receive.

[surface]
schema_version = 1
aggregate_crate = "gpui-toolkit"
aggregate_feature = "all"
release_ready = false

# A capability-level matrix from gpui-toolkit-python-full-surface-design.md.
# ``capability`` is deliberately absent until that entire requirement is
# represented by a tested, typed surface—not merely one convenient class.
[[requirement]]
id = "common.state-bindings-events"
capability = "gpui-python-runtime.bindings"
[[requirement]]
id = "common.effects-jobs-resources"
capability = "gpui-python-runtime.resources"
[[requirement]]
id = "ui.core"
capability = "gpui-ui-kit.declarative"
[[requirement]]
id = "ui.overlays"
[[requirement]]
id = "ui.forms"
capability = "gpui-ui-kit.declarative"
[[requirement]]
id = "ui.navigation-feedback-data-workflow"
[[requirement]]
id = "ui.infrastructure-accessibility"
[[requirement]]
id = "builder.full-solver-and-inspection"
[[requirement]]
id = "design.full-token-and-report-model"
[[requirement]]
id = "themes.full-palettes-and-community-import"
[[requirement]]
id = "pretext.full-preparation-and-layout"
[[requirement]]
id = "keybinding.full-registry"
capability = "gpui-keybinding.registry"
[[requirement]]
id = "px.full-chart-api"
[[requirement]]
id = "d3.full-algorithm-and-interaction-api"
[[requirement]]
id = "audio.full-controls-streams-and-regression"
